name: build-image

# Builds the Com11 Kali image into GHCR:
#   stage=base  — OS + anonymity stack            (~6-10 min)
#   stage=tools — + full security tool catalog    (long: apt/camoufox/183 catalog tools)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "image stage to build"
        required: true
        default: "base"
        type: choice
        options: [base, tools]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt payload
        env:
          COM11_REPO_KEY: ${{ secrets.COM11_REPO_KEY }}
        run: bash bootstrap.sh payload

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          REPO_LC="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          TAG="ghcr.io/${REPO_LC}/com11-kali:${STAGE}"
          docker build --target "$STAGE" -t "$TAG" -f payload/runner/Dockerfile payload
          docker tag "$TAG" "ghcr.io/${REPO_LC}/com11-kali:latest"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Push
        run: |
          REPO_LC="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker push "$TAG"
          docker push "ghcr.io/${REPO_LC}/com11-kali:latest"

      - name: Catalog summary (tools stage)
        if: inputs.stage == 'tools'
        run: |
          CID=$(docker create "$TAG" true)
          docker cp "$CID:/opt/bt-tools/registry-seed.json" ./registry-seed.json || true
          docker rm -f "$CID" >/dev/null
          if [ -f registry-seed.json ]; then
            python3 - <<'PY'
          import json
          r = json.load(open("registry-seed.json"))
          print("summary:", json.dumps(r.get("summary", {})))
          print("apt:", json.dumps(r.get("summary_apt_base", {})))
          print("sources:", json.dumps(r.get("summary_sources", {})))
          print("camoufox:", r.get("summary_camoufox"))
          PY
          fi

      - name: Upload registry seed
        if: inputs.stage == 'tools'
        uses: actions/upload-artifact@v4
        with:
          name: com11-registry-seed-${{ github.run_id }}
          path: registry-seed.json
          retention-days: 90
          if-no-files-found: warn
